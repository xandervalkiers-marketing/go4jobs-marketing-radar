name: Go4Jobs Radar - dagelijks bijwerken en publiceren
on:
  push:
    branches: [main]
    paths-ignore:
      - 'radar-data.json'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3' 'trafilatura>=2,<3' 'googlenewsdecoder==0.1.7' 'selectolax==0.4.13'
      - name: Update nieuwsfeed en optionele AI-analyse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          # Beperk nieuwe betaalde bronanalyses per uitvoering.
          MAX_AI_PER_RUN: '5'
        run: python scripts/update_radar.py
      - name: Bewaar de nieuwe broncontrole en artikelhistoriek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: vernieuw marketingradar-data [skip ci]"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p public
          cp index.html radar-data.json public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
